{% extends 'base.html' %}
{% block title %}Contraseña actualizada{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-12 col-lg-6">
        <div class="card">
            <div class="card-body text-center py-5">
                <i class="bi bi-check2-circle text-success" style="font-size:3rem;"></i>
                <h1 class="h4 mt-3 mb-2">Contraseña actualizada</h1>
                <p class="text-muted mb-4">
                    Tu contraseña se cambió correctamente y tu sesión sigue activa.
                </p>
                <a href="{% url 'vehiculos:dashboard' %}" class="btn btn-primary">
                    <i class="bi bi-speedometer2 me-1"></i>Volver al dashboard
                </a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
